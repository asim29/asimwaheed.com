# pnpm settings for this single-package project. pnpm no longer reads the
# `pnpm.*` fields from package.json (as of pnpm 10+), so these live here.

# Pin every resolution of `yaml` to a version carrying the upstream security
# fix; npm enforced the same via package.json `overrides`.
overrides:
  yaml: ^2.9.0

# pnpm 11 blocks dependency build scripts by default and fails the install
# unless each package with one is explicitly decided via `allowBuilds`
# (the successor to onlyBuiltDependencies / ignoredBuiltDependencies, both
# removed in pnpm 11). We decline both: their prebuilt platform binaries ship
# as separate `@img/sharp-*` and `@esbuild/*` packages already in the lockfile,
# so the build output is byte-identical without running these scripts. This
# keeps the project's --ignore-scripts posture intact on the deploy host, where
# Cloudflare runs a bare `pnpm install` we can't pass flags to.
allowBuilds:
  esbuild: false
  sharp: false

# Fail resolution when a peer range goes unmet, rather than warning and
# resolving anyway. Several packages here embed the TypeScript compiler API —
# typescript-eslint, and @astrojs/check via Volar — and each declares the
# compiler versions it can actually consume. Unenforced, a compiler bump
# outside those ranges resolves cleanly and fails much later with an error
# naming neither the culprit nor the constraint: a TypeScript 7 bump dies in
# `lint` on `Cannot read properties of undefined (reading 'Cjs')`, and hides
# the second blocker behind the first, since CI stops at the earliest failure.
# Enforced, resolution names every blocking package and the range it wants.
#
# Scope: this gates resolution — `pnpm install` that writes a lockfile,
# `pnpm update`, `pnpm add`. It does NOT gate `pnpm install --frozen-lockfile`,
# which skips the resolution step and so installs an already-written lockfile
# regardless. CI runs frozen, and Dependabot writes its own lockfiles, so this
# constrains local dependency work rather than incoming pull requests.
strictPeerDependencies: true
