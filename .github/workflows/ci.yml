name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The job id "ci" is the required status check in the "main-required-checks"
  # ruleset (repo Settings → Rules). Renaming this job silently disables the
  # merge gate, so update the ruleset's required-check context if you rename it.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must precede setup-node: the pnpm cache resolver needs pnpm on PATH to
      # locate the store. Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Lint (ESLint + Stylelint)
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Markdownlint
        run: pnpm run markdownlint

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test
