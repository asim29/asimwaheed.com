name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (ESLint + Stylelint)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Markdownlint
        run: npm run markdownlint

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
