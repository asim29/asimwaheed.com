name: CodeQL

# CodeQL is advisory here: it is NOT one of the required status checks in the
# "main-required-checks" ruleset. That is deliberate — a required check that is
# skipped by the path filter below would never report and would block every
# content-only PR forever. Keeping it advisory lets us path-filter freely.
#
# The path filter runs CodeQL only when first-party JS/TS/Astro source (or this
# workflow) changes, so the common case — editing Markdown content — skips it.
# There is no schedule: scans are event-driven on relevant code changes rather
# than on a fixed weekly cadence.
on:
  push:
    branches: [main]
    paths: &code-paths
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.cjs"
      - "**/*.mjs"
      - "**/*.astro"
      - "tsconfig.json"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths: *code-paths

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:javascript-typescript"
