name: CodeQL

# CodeQL is advisory here: it is NOT one of the required status checks in the
# "main-required-checks" ruleset. That is deliberate — a required check that is
# skipped by the path filter below would never report and would block every
# content-only PR forever. Keeping it advisory lets us path-filter freely.
#
# The path filter runs CodeQL only when first-party JS/TS/Astro source (or this
# workflow) changes, so the common case — editing Markdown content — skips it.
# There is no schedule: scans are event-driven on relevant code changes rather
# than on a fixed weekly cadence.
on:
  push:
    branches: [main]
    paths: &code-paths
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.cjs"
      - "**/*.mjs"
      - "**/*.astro"
      - "tsconfig.json"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths: *code-paths

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: "/language:javascript-typescript"
