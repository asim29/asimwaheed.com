version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    # Matches pnpm 11's default minimumReleaseAge (1440 minutes / 1 day), a
    # supply-chain guard that refuses to install packages published too
    # recently. Without this, Dependabot can open a PR for a version pnpm
    # itself won't accept yet, failing CI until the cutoff passes on its own.
    cooldown:
      default-days: 1
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
